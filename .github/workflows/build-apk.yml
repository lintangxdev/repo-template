name: Build APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'ID unik buat build ini'
        required: true
      app_name:
        description: 'Nama aplikasi'
        required: true
      app_url:
        description: 'URL website yang mau dijadiin app'
        required: true
      icon_path:
        description: 'Path logo di repo ini (hasil upload backend)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Tulis konfigurasi app.properties
        run: |
          cat > app.properties << EOF
          appName=${{ github.event.inputs.app_name }}
          appUrl=${{ github.event.inputs.app_url }}
          jobId=${{ github.event.inputs.job_id }}
          EOF

      - name: Siapin icon jadi berbagai ukuran
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          ICON="${{ github.event.inputs.icon_path }}"
          convert "$ICON" -resize 48x48   app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON" -resize 72x72   app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON" -resize 96x96   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (debug/sideload)
        run: gradle assembleDebug

      - name: Siapin nama file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "${{ github.event.inputs.job_id }}.apk"

      - name: Bikin GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.event.inputs.job_id }}
          name: ${{ github.event.inputs.app_name }}
          body: 'APK hasil build otomatis dari Pembuat APK. Job ID: ${{ github.event.inputs.job_id }}'
          files: ${{ github.event.inputs.job_id }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
